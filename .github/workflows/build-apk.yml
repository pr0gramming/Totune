name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build signed APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Publish build log on failure
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: log-${{ github.run_number }}
          name: Build ${{ github.run_number }} failed (log)
          body: Build log for debugging.
          files: build.log
          prerelease: true
          make_latest: false

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Totune.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Totune-apk
          path: Totune.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Totune build ${{ github.run_number }}
          body: Download Totune.apk below and open it on your Android phone to install.
          files: Totune.apk
          make_latest: true
