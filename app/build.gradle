plugins {
    id 'com.android.application'
}

def buildNumber = Integer.parseInt(System.getenv("GITHUB_RUN_NUMBER") ?: "1")

android {
    namespace 'com.totune.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.totune.app"
        minSdk 29
        targetSdk 34
        versionCode buildNumber
        versionName "2.0." + buildNumber
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static'
                cppFlags '-std=c++17'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    signingConfigs {
        release {
            // Fixed key so new builds install over old ones without losing your takes.
            storeFile file("totune.keystore")
            storePassword "totune-sign"
            keyAlias "totune"
            keyPassword "totune-sign"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
